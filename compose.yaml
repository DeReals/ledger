services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 25.0.0
        PORT: 3000
    container_name: ledger-app
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => { if (r.statusCode !== 200) throw new Error(r.statusCode) })"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # For development, uncomment volumes below and set profiles
    # volumes:
    #   - ./src:/usr/src/app/src
    #   - ./public:/usr/src/app/public
    # profiles:
    #   - dev

